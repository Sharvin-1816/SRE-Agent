<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SRE Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.min.js"></script>

<style>
  *{box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#09090f;margin:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .22s ease-out}
  .spin{animation:spin .7s linear infinite}
  .pdot{animation:pulse 2s infinite}
  .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(139,92,246,.25);border-top-color:#8b5cf6;border-radius:50%;animation:spin .7s linear infinite}
  .scrollbar::-webkit-scrollbar{width:3px}
  .scrollbar::-webkit-scrollbar-thumb{background:#2d2d50;border-radius:3px}
  .thinker:nth-child(1){animation:pulse .8s infinite}
  .thinker:nth-child(2){animation:pulse .8s infinite .2s}
  .thinker:nth-child(3){animation:pulse .8s infinite .4s}
  .bar{height:3px;background:#1e1e35;border-radius:2px;overflow:hidden;margin-top:3px}
  .bar-fill{height:100%;border-radius:2px;transition:width .5s}
  textarea{resize:vertical}
</style>

tailwind.config={theme:{extend:{colors:{
  d:{900:'#09090f',800:'#0e0e18',700:'#131320',600:'#181828',500:'#1f1f35',400:'#27274a',300:'#35356a'},
  v:{DEFAULT:'#8b5cf6',light:'#c4b5fd',dark:'#6d28d9',glow:'rgba(139,92,246,0.1)',b:'rgba(139,92,246,0.2)'},
  g:{DEFAULT:'#10b981',light:'#6ee7b7',glow:'rgba(16,185,129,0.08)',b:'rgba(16,185,129,0.2)'},
  r:{DEFAULT:'#ef4444',light:'#fca5a5',glow:'rgba(239,68,68,0.08)',b:'rgba(239,68,68,0.2)'},
  a:{DEFAULT:'#f59e0b',light:'#fcd34d',glow:'rgba(245,158,11,0.08)',b:'rgba(245,158,11,0.2)'},
  s:{DEFAULT:'#0ea5e9',light:'#7dd3fc',glow:'rgba(14,165,233,0.08)',b:'rgba(14,165,233,0.2)'},

<body class="text-white antialiased">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;
const API='http://localhost:5050';

// ─── helpers ───────────────────────────────────────────────────────────────
function ago(iso){
  if(!iso)return'';
  const d=(Date.now()-new Date(iso))/1000;
  if(d<60)return Math.round(d)+'s ago';
  if(d<3600)return Math.round(d/60)+'m ago';
  if(d<86400)return Math.round(d/3600)+'h ago';
  return new Date(iso).toLocaleDateString();
}

function renderResult(result,mode){
  if(!result)return null;
  // Render the full result object in a readable way
  const m=mode||result.mode||'';

  // RCA
  if(m==='rca'){
    const r=result.rca||result;
    return(
      <div className="space-y-3">
        {r.root_cause&&<div><div className="text-xs font-bold text-v-light uppercase tracking-wider mb-1">Root Cause</div><p className="text-sm text-white/80 leading-relaxed">{r.root_cause}</p></div>}
        {r.evidence?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Evidence</div><ul className="space-y-1">{r.evidence.map((e,i)=><li key={i} className="text-xs text-white/60 flex gap-2"><span className="text-v-light shrink-0">•</span>{e}</li>)}</ul></div>}
        {r.ruling_out?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Ruled Out</div><ul className="space-y-1">{r.ruling_out.map((e,i)=><li key={i} className="text-xs text-white/50 flex gap-2"><span className="text-white/20 shrink-0">✗</span>{e}</li>)}</ul></div>}
        {(r.fix_suggestions||result.fix_suggestions)?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Fix Suggestions</div><ol className="space-y-1">{(r.fix_suggestions||result.fix_suggestions).map((f,i)=><li key={i} className="text-xs text-white/70 flex gap-2"><span className="text-v-light font-bold shrink-0">{i+1}</span>{typeof f==='string'?f:f.action||JSON.stringify(f)}</li>)}</ol></div>}
        {r.context_used&&<div className="text-xs text-white/30 italic">{r.context_used}</div>}
      </div>
    );
  }

  // Prediction
  if(m==='predict_degradation'){
    const p=result.prediction||result;
    return(
      <div className="space-y-3">
        <div className="flex gap-4">
          <div className={`text-2xl font-bold ${p.will_fail?'text-r-light':'text-g-light'}`}>{p.will_fail?'WILL FAIL':'STABLE'}</div>
          {p.estimated_time_to_failure&&<div className="text-sm text-white/50 self-end">ETA: {p.estimated_time_to_failure}</div>}
        </div>
        {p.failure_trigger&&<p className="text-sm text-white/70">{p.failure_trigger}</p>}
        {p.headroom&&<div className="text-xs text-white/40">{p.headroom}</div>}
        {p.context_impact&&<div className="text-xs text-white/50 italic">{p.context_impact}</div>}
        {(p.recommendations||p.scaling_recommendations)?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Recommendations</div><ol className="space-y-1">{(p.recommendations||p.scaling_recommendations).map((f,i)=><li key={i} className="text-xs text-white/70 flex gap-2"><span className="text-v-light font-bold shrink-0">{i+1}</span>{typeof f==='string'?f:JSON.stringify(f)}</li>)}</ol></div>}
      </div>
    );
  }

  // Blast radius
  if(m==='blast_radius'){
    const b=result.blast_radius||result;
    return(
      <div className="space-y-3">
        {b.failure_summary&&<p className="text-sm text-white/70">{b.failure_summary}</p>}
        {b.impact_chain?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-2">Impact Chain</div><div className="space-y-2">{b.impact_chain.map((s,i)=><div key={i} className="flex items-center gap-3 p-2 rounded-lg bg-white/4"><span className={`text-lg font-bold ${s.failure_probability_pct>=70?'text-r-light':s.failure_probability_pct>=40?'text-a-light':'text-g-light'}`}>{s.failure_probability_pct}%</span><div><div className="text-sm font-semibold">{s.service}</div><div className="text-xs text-white/40">{s.cascade_reason||''}</div></div></div>)}</div></div>}
        {b.safe_services?.length>0&&<div className="text-xs text-g-light">Safe: {b.safe_services.join(', ')}</div>}
        {(b.fix_suggestions||result.fix_suggestions)?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Recommendations</div><ol className="space-y-1">{(b.fix_suggestions||result.fix_suggestions).map((f,i)=><li key={i} className="text-xs text-white/70 flex gap-2"><span className="text-v-light font-bold shrink-0">{i+1}</span>{typeof f==='string'?f:f.action||JSON.stringify(f)}</li>)}</ol></div>}
      </div>
    );
  }

  // Load prediction
  if(m==='load_prediction'){
    const l=result.load_prediction||result;
    return(
      <div className="space-y-3">
        <div className="flex gap-6">
          <div><div className="text-xs text-white/30 mb-1">Expected Multiplier</div><div className="text-2xl font-bold text-v-light">{l.expected_load_multiplier}x</div></div>
          {l.peak_window&&<div><div className="text-xs text-white/30 mb-1">Peak Window</div><div className="text-sm text-white/70">{l.peak_window}</div></div>}
        </div>
        {l.context_events?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Context Events</div><ul className="space-y-1">{l.context_events.map((e,i)=><li key={i} className="text-xs text-white/60">• {e}</li>)}</ul></div>}
        {l.at_risk_services?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">At-Risk Services</div><div className="space-y-1">{l.at_risk_services.map((s,i)=><div key={i} className="text-xs text-a-light p-2 rounded bg-a-glow">⚠ {typeof s==='string'?s:s.service_name||JSON.stringify(s)}</div>)}</div></div>}
        {(l.scaling_recommendations||result.scaling_recommendations)?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-1">Scaling Recommendations</div><ol className="space-y-1">{(l.scaling_recommendations||result.scaling_recommendations).map((f,i)=><li key={i} className="text-xs text-white/70 flex gap-2"><span className="text-v-light font-bold shrink-0">{i+1}</span>{typeof f==='string'?f:JSON.stringify(f)}</li>)}</ol></div>}
      </div>
    );
  }

  // Alert grouping
  if(m==='alert_grouping'){
    const g=result.alert_group||result;
    return(
      <div className="space-y-3">
        <div className="flex gap-6">
          <div><div className="text-xs text-white/30 mb-1">Alerts In</div><div className="text-2xl font-bold text-r-light">{g.total_alerts_in||'?'}</div></div>
          <div><div className="text-xs text-white/30 mb-1">Incidents Out</div><div className="text-2xl font-bold text-g-light">{g.total_incidents_out||'?'}</div></div>
          <div><div className="text-xs text-white/30 mb-1">Noise Reduced</div><div className="text-2xl font-bold text-v-light">{g.noise_reduction_pct||'?'}%</div></div>
        </div>
        {g.incidents?.length>0&&<div><div className="text-xs font-bold text-white/30 uppercase tracking-wider mb-2">Incidents</div><div className="space-y-2">{g.incidents.map((inc,i)=><div key={i} className="p-3 rounded-lg bg-white/4 border border-white/5"><div className="font-semibold text-sm">{inc.title||inc.name}</div>{inc.root_service&&<div className="text-xs text-white/40 mt-1">Root: {inc.root_service}</div>}{inc.reason&&<div className="text-xs text-white/50 mt-1">{inc.reason}</div>}</div>)}</div></div>}
      </div>
    );
  }

  // Health query
  if(m==='health_query'){
    const r=result.rca||result;
    return(
      <div className="space-y-3">
        {(r.answer||result.answer)&&<p className="text-sm text-white/80 leading-relaxed">{r.answer||result.answer}</p>}
        {result.confidence!=null&&<div className="text-xs text-white/30">Confidence: {result.confidence}%</div>}
      </div>
    );
  }

  // Fallback — show JSON prettily
  return(
    <pre className="text-xs text-white/60 overflow-auto max-h-96 p-3 rounded-lg bg-d-700 leading-relaxed">
      {JSON.stringify(result,null,2)}
    </pre>
  );
}

function ConfBar({v}){
  if(v==null)return null;
  const c=v>=80?'bg-g-DEFAULT':v>=60?'bg-a-DEFAULT':'bg-r-DEFAULT';
  return(
    <div className="mt-3 pt-3 border-t border-white/5">
      <div className="flex justify-between text-[10px] text-white/25 mb-1 font-semibold uppercase tracking-wider">
        <span>Confidence</span><span>{v}%</span>
      </div>
      <div className="bar"><div className={`bar-fill ${c}`} style={{width:`${v}%`}}/></div>
    </div>
  );
}

// One-line summary for incident/decision cards, correct for every mode.
// Previously the Incidents page used a narrow inline expression that
// only checked inc.rca/inc.root_cause and inc.prediction?.will_fail —
// any other mode (blast_radius, alert_grouping, load_prediction) fell
// through to a hardcoded 'Stable' placeholder regardless of what the
// agent actually found, which is why a 90%-risk blast radius result
// and a real alert-grouping incident both displayed as "Stable" even
// though the full analysis (visible after clicking "Full Analysis")
// showed real, detailed content the whole time. This mirrors the
// per-mode branching renderResult() already does correctly elsewhere
// in this file, just returning plain text instead of JSX.
function quickSummary(o){
  const m=o.mode||'';
  if(m==='rca'){
    const r=o.rca||o;
    return r.root_cause||'RCA completed';
  }
  if(m==='predict_degradation'){
    const p=o.prediction||o;
    return p.will_fail?`Will fail: ${p.estimated_time_to_failure||'soon'}`:'Stable — no failure predicted';
  }
  if(m==='blast_radius'){
    const b=o.blast_radius||o;
    if(b.failure_summary)return b.failure_summary;
    const chain=b.impact_chain;
    if(chain&&chain.length>0)return`${chain[0].service} at ${chain[0].failure_probability_pct}% failure risk`;
    return'Blast radius estimated';
  }
  if(m==='load_prediction'){
    const l=o.load_prediction||o;
    return`Expected load: ${l.expected_load_multiplier||'?'}x normal`+(l.peak_window?` — peak ${l.peak_window}`:'');
  }
  if(m==='alert_grouping'){
    const g=o.alert_group||o;
    const title=g.incidents?.[0]?.title;
    return title||`${g.total_alerts_in||'?'} alerts grouped into ${g.total_incidents_out||'?'} incident(s)`;
  }
  if(m==='health_query'){
    return o.answer||o.rca?.answer||'Health query answered';
  }
  return o.answer||'Agent analysis completed';
}

const MODE_CFG={
  rca:{label:'RCA',tc:'text-r-light',bg:'bg-r-glow border-r-b'},
  predict_degradation:{label:'Prediction',tc:'text-a-light',bg:'bg-a-glow border-a-b'},
  blast_radius:{label:'Blast Radius',tc:'text-s-light',bg:'bg-s-glow border-s-b'},
  load_prediction:{label:'Load',tc:'text-v-light',bg:'bg-v-glow border-v-b'},
  alert_grouping:{label:'Alerts',tc:'text-g-light',bg:'bg-g-glow border-g-b'},
  health_query:{label:'Health',tc:'text-g-light',bg:'bg-g-glow border-g-b'},
};
function Badge({mode}){
  const c=MODE_CFG[mode]||{label:mode,tc:'text-v-light',bg:'bg-v-glow border-v-b'};
  return<span className={`text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider border ${c.tc} ${c.bg}`}>{c.label}</span>;
}

// ─── Job hook ───────────────────────────────────────────────────────────────
function useJob(){
  const [jobId,setJobId]=useState(null);
  const [status,setStatus]=useState(null); // null | running | done | error
  const [result,setResult]=useState(null);
  const [error,setError]=useState(null);

  async function run(endpoint,body){
    setStatus('running');setResult(null);setError(null);setJobId(null);
    try{
      const r=await fetch(`${API}/api/jobs/${endpoint}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
      const d=await r.json();
      if(d.job_id)setJobId(d.job_id);
      else{setStatus('error');setError(d.detail||'No job id returned');}
    }catch(e){setStatus('error');setError(e.message);}
  }

  useEffect(()=>{
    if(!jobId||status==='done'||status==='error')return;
    const iv=setInterval(async()=>{
      try{
        const r=await fetch(`${API}/api/jobs/${jobId}`);
        const d=await r.json();
        setStatus(d.status);
        if(d.status==='done'){setResult(d.result);clearInterval(iv);}
        if(d.status==='error'){setError(d.error);clearInterval(iv);}
      }catch(e){clearInterval(iv);setStatus('error');setError(e.message);}
    },2000);
    return()=>clearInterval(iv);
  },[jobId,status]);

  function reset(){setJobId(null);setStatus(null);setResult(null);setError(null);}
  return{status,result,error,run,reset};
}

function Thinking(){
  return(
    <div className="flex items-center gap-2 p-3 rounded-xl bg-d-700 border border-white/5 mt-3">
      <div className="flex gap-1">
        {[0,1,2].map(i=><div key={i} className={`thinker w-1.5 h-1.5 rounded-full bg-v-DEFAULT`}/>)}
      </div>
      <span className="text-xs text-white/40">Agent analyzing...</span>
    </div>
  );
}

function ResultBox({status,result,error,mode}){
  if(!status)return null;
  return(
    <div className="mt-3 p-4 rounded-xl bg-d-700 border border-white/5 fade-up">
      {(status==='running'||status==='pending')&&<Thinking/>}
      {status==='done'&&result&&(
        <>
          <Badge mode={mode||result.mode}/>
          <div className="mt-3">{renderResult(result,mode||result.mode)}</div>
          <ConfBar v={result.confidence}/>
        </>
      )}
      {status==='error'&&<p className="text-sm text-r-light">{error||'Analysis failed'}</p>}
    </div>
  );
}

// ─── Pages ──────────────────────────────────────────────────────────────────

function ServiceCard({svc}){
  const rca=useJob();
  const blast=useJob();
  const pred=useJob();
  const name=(svc.service_name||svc.name||'').replace('_service','');
  const rt=+(svc.response_time_ms||0),er=+(svc.error_rate_pct??0),cpu=+(svc.cpu_pct??0),mem=+(svc.memory_pct??0);
  // API returns is_reachable/status_code but no explicit status string
  // Derive: down=unreachable, degraded=high error/latency, else up
  const reachable = svc.is_reachable !== false;
  const degraded = er >= 5 || rt >= 5000 || cpu >= 90;
  const st = !reachable ? 'down' : degraded ? 'degraded' : 'up';
  const up=st==='up',down=st==='down';
  const border=up?'border-l-g-DEFAULT':down?'border-l-r-DEFAULT':'border-l-a-DEFAULT';
  const sc=up?'text-g-light bg-g-glow':down?'text-r-light bg-r-glow':'text-a-light bg-a-glow';
  const [open,setOpen]=useState(null);

  function trigger(job,ep){job.run(ep,{service_name:svc.service_name||svc.name});setOpen(ep);}

  function MetricRow({label,val,unit,warn,crit,bar}){
    const v=parseFloat(val)||0;
    const c=v>=crit?'text-r-light':v>=warn?'text-a-light':'text-white/60';
    const bc=v>=crit?'bg-r-DEFAULT':v>=warn?'bg-a-DEFAULT':'bg-g-DEFAULT';
    const pct=bar?Math.min(v/crit*100,100):0;
    return(
      <div>
        <div className="flex justify-between">
          <span className="text-[11px] text-white/30">{label}</span>
          <span className={`text-xs font-semibold font-mono ${c}`}>{typeof val==='number'?Math.round(val):val}{unit}</span>
        </div>
        {bar&&<div className="bar"><div className={`bar-fill ${bc}`} style={{width:pct+'%'}}/></div>}
      </div>
    );
  }

  return(
    <div className={`bg-d-800 rounded-2xl p-4 border border-white/5 border-l-2 ${border} flex flex-col gap-3 transition-all hover:-translate-y-0.5 duration-200`}>
      <div className="flex items-center justify-between">
        <span className="font-bold text-sm uppercase tracking-wide">{name}</span>
        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider ${sc}`}>{st}</span>
      </div>
      <div className="space-y-2">
        <MetricRow label="Response" val={rt} unit="ms" warn={2000} crit={4000} bar/>
        <MetricRow label="Error Rate" val={er.toFixed(1)} unit="%" warn={2} crit={5}/>
        <MetricRow label="CPU" val={cpu} unit="%" warn={60} crit={85} bar/>
        <MetricRow label="Memory" val={mem} unit="%" warn={70} crit={90}/>
      </div>
      <div className="grid grid-cols-3 gap-1.5">
        {[
          {label:'RCA',job:rca,ep:'rca'},
          {label:'Predict',job:pred,ep:'prediction'},
          {label:'Blast',job:blast,ep:'blast-radius'},
        ].map(({label,job,ep})=>(
          <button key={ep} onClick={()=>trigger(job,ep)} disabled={rca.status==='running'||blast.status==='running'||pred.status==='running'}
            className={`py-1.5 rounded-lg text-xs font-bold border transition-all disabled:opacity-30 ${open===ep?'bg-v-glow border-v-b text-v-light':'bg-white/4 border-white/8 text-white/50 hover:text-white hover:border-white/20'}`}>
            {job.status==='running'?<span className="spinner"/>:label}
          </button>
        ))}
      </div>
      {open==='rca'&&(rca.status||rca.result)&&<ResultBox status={rca.status} result={rca.result} error={rca.error} mode="rca"/>}
      {open==='prediction'&&(pred.status||pred.result)&&<ResultBox status={pred.status} result={pred.result} error={pred.error} mode="predict_degradation"/>}
      {open==='blast-radius'&&(blast.status||blast.result)&&<ResultBox status={blast.status} result={blast.result} error={blast.error} mode="blast_radius"/>}
      {open&&(rca.result||blast.result||pred.result||rca.status==='error'||blast.status==='error'||pred.status==='error')&&(
        <button onClick={()=>{setOpen(null);rca.reset();blast.reset();pred.reset();}} className="text-xs text-white/25 hover:text-white/50 text-left">↑ hide</button>
      )}
    </div>
  );
}

function DecisionCard({item}){
  const [open,setOpen]=useState(false);
  const mode=item.mode||'';
  const summary=item.summary||quickSummary(item);
  return(
    <div className="p-4 rounded-xl bg-d-800 border border-white/5 hover:border-white/10 transition-all fade-up">
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="flex items-center gap-2 flex-wrap">
          <Badge mode={mode}/>
          <span className="text-sm font-semibold">{item.service_name||'system'}</span>
        </div>
        <div className="flex items-center gap-3 shrink-0">
          {item.confidence!=null&&<span className="text-[11px] text-white/30 font-mono">{item.confidence}%</span>}
          <span className="text-[11px] text-white/20">{ago(item.generated_at)}</span>
        </div>
      </div>
      <p className="text-sm text-white/55 leading-relaxed">{summary}</p>
      <button onClick={()=>setOpen(!open)} className="mt-2 text-xs text-v-DEFAULT/60 hover:text-v-light flex items-center gap-1 transition-colors">
        <i className={`fa fa-chevron-${open?'up':'down'} text-[9px]`}/> {open?'hide full analysis':'view full analysis'}
      </button>
      {open&&<div className="mt-3 pt-3 border-t border-white/5 fade-up">{renderResult(item,mode)}<ConfBar v={item.confidence}/></div>}
    </div>
  );
}

function Dashboard(){
  const [svcs,setSvcs]=useState([]);
  const [decisions,setDecisions]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState(null);

function Simulate(){
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const [selectedSvc,setSelectedSvc]=useState('payment_service');

  const scenarios=[
    {id:'degrade',label:'Gradual Degradation',desc:'Slowly degrades a service — triggers predictive alert',icon:'fa-arrow-trend-down',color:'text-a-light',service:true},
    {id:'cascade',label:'Cascading Failure',desc:'Payment fails → cart degrades (blast radius)',icon:'fa-share-nodes',color:'text-r-light'},
    {id:'surge',label:'Traffic Surge 5x',desc:'Simulate Black Friday load — tests load prediction',icon:'fa-bolt',color:'text-v-light'},
    {id:'outage',label:'Gateway Outage',desc:'Full gateway down — triggers noise reduction',icon:'fa-skull-crossbones',color:'text-r-light'},
    {id:'recover',label:'Recover All',desc:'Restore all services to normal',icon:'fa-heart-circle-check',color:'text-g-light'},
  ];

  async function trigger(scenario){
    setLoading(true);setResult(null);
    try{
      const body={scenario:scenario.id};
      if(scenario.service)body.service=selectedSvc;
      const r=await fetch(`${API}/api/simulate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      setResult(d);
    }catch(e){setResult({error:e.message});}
    setLoading(false);
  }

  return(
    <div className="p-8 max-w-3xl mx-auto fade-up">
      <h1 className="text-2xl font-bold mb-2">Incident Simulator</h1>
      <p className="text-sm text-white/35 mb-6">Trigger demo scenarios to test agent detection and response</p>
      <div className="space-y-3">
        {scenarios.map(sc=>(
          <div key={sc.id} className="flex items-center gap-4 p-4 rounded-xl bg-d-800 border border-white/5 hover:border-white/10 transition-all">
            <div className={`w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center shrink-0 ${sc.color}`}>
              <i className={`fa ${sc.icon}`}/>
            </div>
            <div className="flex-1">
              <div className="font-semibold text-sm">{sc.label}</div>
              <div className="text-xs text-white/40 mt-0.5">{sc.desc}</div>
            </div>
            {sc.service&&(
              <select value={selectedSvc} onChange={e=>setSelectedSvc(e.target.value)}
                className="px-2 py-1 rounded-lg bg-d-700 border border-white/8 text-xs text-white/60 focus:outline-none">
                {['payment_service','cart_service','notification_service','auth_service','inventory_service','gateway_service'].map(s=>(
                  <option key={s} value={s}>{s.replace('_service','')}</option>
                ))}
              </select>
            )}
            <button onClick={()=>trigger(sc)} disabled={loading}
              className="px-4 py-2 rounded-xl text-xs font-bold bg-v-glow border border-v-b text-v-light hover:bg-v-DEFAULT/20 transition-all disabled:opacity-40 flex items-center gap-2">
              {loading?<span className="spinner"/>:<i className="fa fa-play text-[9px]"/>} Run
            </button>
          </div>
        ))}
      </div>
      {result&&(
        <div className="mt-6 p-4 rounded-xl bg-d-800 border border-white/5 fade-up">
          {result.error?<p className="text-sm text-r-light">{result.error}</p>:(
            <>
              <div className="text-xs font-bold text-g-light uppercase tracking-wider mb-3">✓ Scenario triggered</div>
              <div className="space-y-1">
                {Object.entries(result.results||{}).map(([svc,status])=>(
                  <div key={svc} className="flex justify-between text-sm">
                    <span className="text-white/60">{svc}</span>
                    <span className={status==='failed'?'text-r-light':'text-g-light'}>{status}</span>
                  </div>
                ))}
              </div>
              <p className="text-xs text-white/30 mt-3">Collector will detect this on the next poll (up to 60s)</p>
            </>
          )}
        </div>
      )}
    </div>
  );
}

        </select>
        <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()} placeholder="Search logs... (Enter to search)"
          className="flex-1 min-w-48 px-3 py-2 rounded-lg text-sm bg-d-800 border border-white/8 text-white placeholder-white/20 focus:outline-none focus:border-v-DEFAULT/40"/>
        {logs.length>0&&<span className="self-center text-xs text-white/20">{logs.length} entries</span>}
      </div>
      {loading?<div className="flex gap-3 items-center text-sm text-white/30 py-8"><span className="spinner"/>Loading from Loki...</div>:logs.length===0?(
        <div className="rounded-2xl border border-white/5 bg-d-800 p-16 text-center">
          <i className="fa fa-file-lines text-3xl text-white/10 block mb-3"/>
          <p className="text-sm text-white/30">No logs found</p>
          <p className="text-xs text-white/15 mt-1">Make sure Docker is running and the agent is active</p>
        </div>
      ):(
        <div className="rounded-2xl border border-white/5 overflow-hidden">
          <table className="w-full text-sm border-collapse">
            <thead className="bg-d-800">
              <tr>{['Time','Component','Level','Message'].map(h=><th key={h} className="px-4 py-3 text-left text-[10px] font-bold uppercase tracking-widest text-white/25 border-b border-white/5">{h}</th>)}</tr>
            </thead>
            <tbody>
              {logs.map((log,i)=>(
                <tr key={i} className="border-b border-white/4 hover:bg-white/[.02]">
                  <td className="px-4 py-3 font-mono text-[11px] text-white/25 whitespace-nowrap">{log.timestamp?new Date(log.timestamp).toLocaleTimeString():'—'}</td>
                  <td className="px-4 py-3"><span className={`text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide ${CC[log._comp||log.component]||'text-white/40 bg-white/5'}`}>{log._comp||log.component||'—'}</span></td>
                  <td className="px-4 py-3"><span className={`text-xs font-semibold ${LC[log.level]||'text-white/40'}`}>{log.level||'info'}</span></td>
                  <td className="px-4 py-3">
                    <div className="text-sm text-white/75">{log.message||'—'}</div>
                    {(log.service||log.score!=null||log.error)&&(
                      <div className="mt-1 font-mono text-[10px] text-white/25">
                        {log.service&&<span className="mr-3">service={log.service}</span>}
                        {log.score!=null&&<span className="mr-3">score={log.score}</span>}
                        {log.error&&<span className="text-r-light">{String(log.error).slice(0,120)}</span>}
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Incidents page ──────────────────────────────────────────────────────────
function Incidents({onClear}){
  const [incidents,setIncidents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [seen,setSeen]=useState(()=>new Set(JSON.parse(localStorage.getItem('sre_seen_incidents')||'[]')));

  async function load(){
    try{
      const r=await fetch(`${API}/api/decisions?limit=50`);
      if(r.ok){const d=await r.json();setIncidents(d.decisions||[]);}
    }catch(e){}
    setLoading(false);
  }

  function markSeen(id){
    const next=new Set([...seen,id]);
    setSeen(next);
    localStorage.setItem('sre_seen_incidents',JSON.stringify([...next]));
  }

  function markAllSeen(){
    const next=new Set(incidents.map(i=>i.id));
    setSeen(next);
    localStorage.setItem('sre_seen_incidents',JSON.stringify([...next]));
    if(onClear)onClear();
  }

  useEffect(()=>{load();const iv=setInterval(load,15000);return()=>clearInterval(iv);},[]);

  // Notify parent of unseen count
  useEffect(()=>{
    const unseen=incidents.filter(i=>!seen.has(i.id));
    if(onClear)onClear(unseen.length);
  },[incidents,seen]);

  const SEV={rca:'r',predict_degradation:'a',blast_radius:'s',load_prediction:'v',alert_grouping:'g',health_query:'g'};

  function SeverityIcon({mode}){
    const c={r:'text-r-light',a:'text-a-light',s:'text-s-light',v:'text-v-light',g:'text-g-light'}[SEV[mode]||'v']||'text-v-light';
    const ic={rca:'fa-triangle-exclamation',predict_degradation:'fa-chart-line',blast_radius:'fa-bolt',load_prediction:'fa-arrow-up',alert_grouping:'fa-bell',health_query:'fa-stethoscope'}[mode]||'fa-circle-dot';
    return <i className={`fa ${ic} ${c} text-sm`}/>;
  }

  const unseen=incidents.filter(i=>!seen.has(i.id));

  return(
    <div className="p-8 max-w-screen-lg mx-auto fade-up space-y-6">
      <div className="flex items-start justify-between">
        <div>
          <h1 className="text-2xl font-bold flex items-center gap-3">
            Incidents
            {unseen.length>0&&<span className="text-sm font-bold px-2.5 py-1 rounded-full bg-r-glow border border-r-b text-r-light pdot">{unseen.length} new</span>}
          </h1>
          <p className="text-sm text-white/35 mt-1">Agent-detected anomalies and automated analysis — auto-refreshes every 15s</p>
        </div>
        <div className="flex gap-3">
          {unseen.length>0&&<button onClick={markAllSeen} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/5 hover:bg-white/10 border border-white/8 transition-all">Mark all seen</button>}
          <button onClick={load} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white/5 hover:bg-white/10 border border-white/8 transition-all flex items-center gap-1.5"><i className="fa fa-rotate-right text-[10px]"/>Refresh</button>
        </div>
      </div>

      {loading?(
        <div className="flex gap-3 items-center text-sm text-white/30 py-8"><span className="spinner"/>Loading incidents...</div>
      ):incidents.length===0?(
        <div className="rounded-2xl border border-white/5 bg-d-800 p-16 text-center">
          <i className="fa fa-shield-halved text-4xl text-white/10 block mb-4"/>
          <p className="text-sm text-white/30 font-semibold">No incidents recorded</p>
          <p className="text-xs text-white/15 mt-2">Incidents appear here when the agent detects and analyzes anomalies</p>
        </div>
      ):(
        <div className="space-y-4">
          {incidents.map((inc,i)=>(
            <IncidentCard key={inc.id||i} inc={inc} isNew={!seen.has(inc.id)} onSeen={()=>markSeen(inc.id)} sevMap={SEV} severityIcon={SeverityIcon}/>
          ))}
        </div>
      )}
    </div>
  );
}

// Standalone component — NOT inline inside .map() — because hooks
// (useState for `expanded`) cannot legally be called inside a loop or
// callback. Calling useState directly inside incidents.map(...) crashed
// the entire Incidents page on every render: React requires hooks to
// run in the same order every time, and a loop body violates that the
// moment the list has more than zero items. This is the same class of
// bug noted earlier in this project for the original Incidents
// component (illegal hook inside .map() causing a blank page) -
// the fix is identical: give each list item its own component, so each
// one gets its own independent hook call, not a hook call per loop
// iteration inside the parent's single render.
function IncidentCard({inc,isNew,onSeen,sevMap,severityIcon:SeverityIcon}){
  const [expanded,setExpanded]=useState(false);
  const sev=sevMap[inc.mode]||'v';
  const borderColor={r:'border-l-r-DEFAULT',a:'border-l-a-DEFAULT',s:'border-l-s-DEFAULT',v:'border-l-v-DEFAULT',g:'border-l-g-DEFAULT'}[sev];
  const bgGlow={r:'bg-r-glow',a:'bg-a-glow',s:'bg-s-glow',v:'bg-v-glow',g:'bg-g-glow'}[sev];

  return(
    <div className={`bg-d-800 rounded-2xl border border-white/5 border-l-2 ${borderColor} fade-up overflow-hidden`}>
      <div className="p-4 flex items-start gap-4">
        <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${bgGlow}`}>
          <SeverityIcon mode={inc.mode}/>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap mb-1">
            <Badge mode={inc.mode}/>
            <span className="font-bold text-sm">{inc.service_name||'system'}</span>
            {isNew&&<span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-r-glow border border-r-b text-r-light uppercase tracking-wider pdot">NEW</span>}
          </div>
          <p className="text-sm text-white/55 leading-snug">
            {quickSummary(inc)}
          </p>
          <div className="flex items-center gap-4 mt-2">
            <span className="text-xs text-white/25">{ago(inc.generated_at)}</span>
            {inc.confidence!=null&&<span className="text-xs font-mono text-white/30">{inc.confidence}% confidence</span>}
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <button
            onClick={()=>{setExpanded(!expanded);if(isNew)onSeen();}}
            className="px-3 py-1.5 rounded-lg text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/8 transition-all flex items-center gap-1.5">
            <i className={`fa fa-chevron-${expanded?'up':'down'} text-[9px]`}/>
            {expanded?'Hide':'Full Analysis'}
          </button>
        </div>
      </div>
      {expanded&&(
        <div className="px-4 pb-4 pt-0 border-t border-white/5 fade-up">
          <div className="mt-4">
            {renderResult(inc, inc.mode)}
            <ConfBar v={inc.confidence}/>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── App shell ──────────────────────────────────────────────────────────────
const PAGES=[
  {id:'dashboard',label:'Dashboard',icon:'fa-gauge-high'},
  {id:'incidents',label:'Incidents',icon:'fa-triangle-exclamation'},
  {id:'query',label:'Health Query',icon:'fa-message'},
  {id:'context',label:'Context',icon:'fa-note-sticky'},
  {id:'memory',label:'Memory',icon:'fa-brain'},
  {id:'simulate',label:'Simulate',icon:'fa-flask'},
  {id:'webhooks',label:'Webhooks',icon:'fa-bell'},
  {id:'logs',label:'Logs',icon:'fa-file-lines'},
];

  const [page,setPage]=useState('dashboard');

  return(

        <div>
          <div className="flex items-center gap-2.5 px-3 mb-8">
            <div className="w-7 h-7 rounded-lg bg-v-glow border border-v-b flex items-center justify-center">
              <i className="fa fa-microchip text-v-light text-xs"/>
            </div>
            <span className="font-bold text-sm">SRE Agent</span>
          </div>
          <nav className="space-y-0.5">
            {PAGES.map(p=>(
              <button key={p.id} onClick={()=>setPage(p.id)}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all ${page===p.id?'bg-v-glow border border-v-b text-white':'text-white/35 hover:text-white/70 hover:bg-white/4'}`}>
                <i className={`fa ${p.icon} text-sm ${page===p.id?'text-v-light':'text-white/20'}`}/>
                <span className="flex-1 text-left">{p.label}</span>
                {p.id==='incidents'&&incidentCount>0&&(
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-r-DEFAULT text-white min-w-[18px] text-center leading-none pdot">
                    {incidentCount}
                  </span>
                )}
              </button>
            ))}
          </nav>
        </div>
        <div className="px-3 space-y-3">
          <div className="flex items-center gap-2 p-2.5 rounded-xl bg-g-glow border border-g-b">
            <div className="w-1.5 h-1.5 rounded-full bg-g-DEFAULT pdot"/>
            <span className="text-xs font-semibold text-g-light">Live</span>
          </div>
          <p className="text-[10px] text-white/15 text-center">v3.2</p>
        </div>
      </aside>
      <main className="flex-1 overflow-y-auto scrollbar bg-d-900">
        {page==='dashboard'&&<Dashboard/>}
        {page==='incidents'&&<Incidents onClear={setIncidentCount}/>}
        {page==='query'&&<HealthQuery/>}
        {page==='context'&&<Context/>}
        {page==='memory'&&<Memory/>}

        {page==='webhooks'&&<Webhooks/>}
        {page==='logs'&&<Logs/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
