server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: sre_collector
    static_configs:
      - targets: [localhost]
        labels:
          job:       sre_collector
          component: collector
          __path__:  /var/log/sre-agent/collector.log

  - job_name: sre_services
    static_configs:
      - targets: [localhost]
        labels:
          job:       sre_services
          component: services
          __path__:  /var/log/sre-agent/services.log

  - job_name: sre_webhook
    static_configs:
      - targets: [localhost]
        labels:
          job:       sre_webhook
          component: webhook
          __path__:  /var/log/sre-agent/webhook.log

  - job_name: sre_agent
    static_configs:
      - targets: [localhost]
        labels:
          job:       sre_agent
          component: agent
          __path__:  /var/log/sre-agent/agent.log
